[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "extruder"
version = "0.1.0"
description = "Helper code for the extruder cut-frame pipeline (SAM 2.1): video reading, cut detection, prompting, tracking, die-plate calibration and measurement."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
