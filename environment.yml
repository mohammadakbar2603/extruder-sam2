# Conda environment for the extruder SAM 2 pipeline.
# Create it with:   bash setup_env.sh      (recommended: also installs SAM 2 and downloads the model)
# or by hand with:  conda env create -f environment.yml   (then follow the README "Manual setup")
name: extruder-sam2
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - git
  - ffmpeg            # reads the 10-bit HEVC slow-motion videos from the camera
  - pip:
      # PyTorch built for CUDA 12.8 (works on RTX 20xx-50xx GPUs with a recent NVIDIA driver)
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.8.0
      - torchvision==0.23.0
      - numpy>=1.26,<2.3
      - opencv-python-headless>=4.9
      - scipy>=1.11
      - pandas>=2.1
      - matplotlib>=3.8
      - pillow>=10.0
      - scikit-image>=0.22
      - tqdm>=4.66
      - hydra-core>=1.3.2
      - iopath>=0.1.10
      - ipykernel>=6.29
      - ipywidgets>=8.1
      - ipympl>=0.9.4
